<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結帳清單</title>
</head>
<body style="background-color: white !important; color: black !important; margin: 0; padding: 0;">

    <div style="background: #111827; color: white; padding: 20px; font-size: 1.2rem;">
        <span onclick="window.location.href='index.html'" style="cursor:pointer;">⬅ 返回商店</span>
    </div>

    <div style="max-width: 600px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
        <h2 style="color: black;">🛒 您的購物車內容</h2>
        <hr>
        <div id="cart-list" style="min-height: 100px; color: black;"></div>
        <hr>
        <div style="text-align: right; font-size: 1.5rem; color: black; margin-top: 20px;">
            總計：NT$ <span id="total-price">0</span>
        </div>
        <button onclick="checkout()" style="width: 100%; padding: 15px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 1.2rem; margin-top: 20px; cursor: pointer;">
            確認購買
        </button>
    </div>

    <script>
        function renderCart() {
            const list = document.getElementById("cart-list");
            const totalEl = document.getElementById("total-price");
            
            // 從 LocalStorage 讀取資料
            let cartData = localStorage.getItem("myCart");
            let cart = cartData ? JSON.parse(cartData) : [];

            if (cart.length === 0) {
                list.innerHTML = "<p style='color: gray; text-align: center; margin-top: 20px;'>購物車目前是空的喔！</p>";
                totalEl.innerText = 0;
                return;
            }

            let total = 0;
            list.innerHTML = "";

            // 渲染每一筆商品，並加上刪除按鈕
            cart.forEach((item, index) => {
                total += item.price;

                const div = document.createElement("div");
                div.style = "display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #eee; color: black;";

                div.innerHTML = `
                    <div>
                        <span style="font-weight: bold;">${item.name}</span>
                        <br>
                        <span style="color: #666; font-size: 0.9rem;">NT$ ${item.price}</span>
                    </div>
                    <button onclick="removeFromCart(${index})" style="background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 0.8rem;">
                        刪除
                    </button>
                `;

                list.appendChild(div);
            });

            totalEl.innerText = total;
        }

        // 刪除功能的邏輯
        function removeFromCart(index) {
            // 1. 取得現有的購物車資料
            let cartData = localStorage.getItem("myCart");
            let cart = cartData ? JSON.parse(cartData) : [];

            // 2. 根據索引值 (index) 刪除該項物品
            cart.splice(index, 1);

            // 3. 把更新後的資料存回 LocalStorage
            localStorage.setItem("myCart", JSON.stringify(cart));

            // 4. 重新畫一次畫面
            renderCart();
        }

        function checkout() {
            let cartData = localStorage.getItem("myCart");
            if (!cartData || JSON.parse(cartData).length === 0) {
                alert("購物車是空的，不能結帳喔！");
                return;
            }
            alert("感謝購買！");
            localStorage.removeItem("myCart");
            window.location.href = "index.html";
        }

        window.onload = renderCart;
    </script>
</body>
</html>
